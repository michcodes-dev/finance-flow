<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | FinanceFlow</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            Finance<span>Flow</span>
        </div>

        <nav class="sidebar-nav">
            <a href="index.html">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>

            <a href="transactions.html">
                <i class="fa-solid fa-arrow-right-arrow-left"></i>
                <span>Transactions</span>
            </a>

            <a href="analytics.html">
                <i class="fa-solid fa-chart-line"></i>
                <span>Analytics</span>
            </a>

            <a href="budgets.html">
                <i class="fa-solid fa-wallet"></i>
                <span>Budgets</span>
            </a>
        </nav>

        <div class="sidebar-bottom">
            <a href="settings.html">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>

            <a href="#" id="logout-link">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <div>
                <h1>My Profile</h1>
                <p>Manage your personal information.</p>
            </div>
        </header>

        <section class="settings-panel profile-panel">
            <div class="profile-hero">
                <div class="profile-large-avatar" id="profile-page-avatar">
                    U
                </div>
                
                <div class="profile-hero-info">
                    <h2 id="profile-page-name">User</h2>
                    <p>Personal account</p>
                </div>
                
                <button type="button" class="profile-edit-link" id="open-edit-profile">
                    <i class="fa-solid fa-pen"></i>
                    Edit Profile
                </button>
            </div>

            <div class="profile-details">
                <div class="profile-detail">
                    <span>Display name</span>
                    <strong id="profile-display-name">User</strong>
                </div>

                <div class="profile-detail">
                    <span>Account type</span>
                    <strong>Personal</strong>
                </div>

                <div class="profile-detail">
                    <span>Preferred currency</span>
                    <strong>Nigerian Naira (₦)</strong>
                </div>
            </div>

            <a href="settings.html" class="profile-edit-link">
                <i class="fa-solid fa-gear"></i>
                Edit settings
            </a>
        </section>
        
        <div class="profile-modal" id="profile-modal" hidden>
            <div class="profile-modal-content">
                <div class="profile-modal-header">
                    <div>
                        <h2>Edit Profile</h2>
                        <p>Update your personal information.</p>
                    </div>
                    
                    <button type="button" id="close-profile-modal" aria-label="Close">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                
                <form id="edit-profile-form">
                    <div class="profile-photo-editor">
                        <div class="profile-large-avatar" id="profile-preview-avatar">
                            U
                        </div>
                        
                        <div>
                            <label for="profile-photo">Profile picture</label>
                            <input
                                type="file"
                                id="profile-photo"
                                accept="image/png,image/jpeg,image/webp"
                                >
                                <button type="button" id="remove-profile-photo">
                                    Remove picture
                                </button>
                            </div>
                        </div>
                        
                        <div class="settings-field">
                            <label for="edit-display-name">Display name</label>
                            <input
                                type="text"
                                id="edit-display-name"
                                maxlength="40"
                                required
                            >
                        </div>
                        
                        <p id="profile-form-message" role="status"></p>
                        
                        <div class="profile-modal-actions">
                            <button type="button" id="cancel-profile-edit">
                                Cancel
                            </button>
                            
                            <button type="submit" class="add-budget-btn">
                                <i class="fa-solid fa-check"></i>
                                Save Profile
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
        <script type="module" src="js/profile.js"></script>
</body>
</html>
